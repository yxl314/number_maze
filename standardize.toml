# cxx_ci/standardize 配置 —— number-maze
#
# 当前 Qt 5.6 + clang-tidy 14~21 无法解析 Qt 头文件，style 阶段只做
# clang-format；tidy 的启用条件见文末。禁改区和第三方代码通过 exclude 排除。
#
# 测试是独立 qmake 工程，不在主工程的 compile_commands.json 中；格式检查
# 覆盖 src 与 tests，测试的构建和运行由 cxx_ci 负责。
#
# 在仓库根目录运行：
#     python3 ../cxx_ci/standardize/standardize.py --check
#     python3 ../cxx_ci/standardize/standardize.py
#     python3 ../cxx_ci/standardize/standardize.py --apply
[standardize]
paths = ["src", "tests"]
exclude = ["build", "third_party", "dist"]
build_dir = "build/standardize"
diff = "standardize.diff"
stage_dir = ".standardize"
qmake = "qmake5"
auto_compile_commands = true
# 安装的 clang-tidy 14~21 均无法解析 Qt 5.6.3 头文件（qtypetraits/QFlags
# 报 clang-diagnostic-error），本机无法运行全量 tidy；Qt 6 迁移或换用兼容
# 的 clang-tidy 后再打开。格式检查不受影响，保持开启。
tidy = false
format = true
