name = "number-maze"
build_system = "qmake"
source_dir = "."
project_file = "number-maze.pro"
build_dir = "build/ci"

clean_paths = ["build/tests"]

[tools]
qmake = "qmake5"
make = "make"

[output]
build = "warnings"
test = "failures"
dir = "ci-logs"

[test]
framework = "custom"
commands = [["sh", "tests/run_all.sh"]]

[test.env]
QMAKE = "qmake5"
QT_QPA_PLATFORM = "offscreen"
