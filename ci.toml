# cxx_ci 配置 —— number-maze
# 入口：./check.sh ci 或 python3 ../cxx_ci/check.py ci --root .

name = "number-maze"
build_system = "qmake"
source_dir = "."
project_file = "number-maze.pro"
build_dir = "build/ci"

clean_paths = ["build/tests"]

[tools]
# make 不显式配置：缺省值由 cxx_ci 的平台层按平台选（POSIX 用 make，
# Windows 用 mingw32-make/nmake），显式写 "make" 在 Windows 上不存在。
qmake = "qmake5"

[output]
build = "warnings"
test = "failures"
dir = "ci-logs"

[test]
framework = "custom"
# 用 Python 入口而不是 sh：Linux 与 Windows 同一份配置，不依赖 shell。
commands = [["python3", "tests/run_all.py"]]

[test.env]
# qmake 由 tests/run_all.py 按平台选（Linux qmake5 / Windows qmake-qt5），
# 这里不再写死，配置在两个平台上保持一致。
QT_QPA_PLATFORM = "offscreen"
