# cxx_audit 配置 —— number-maze
#
# 用法（仓库根目录）：
#     PYTHONPATH=../cxx_audit/src python3 -m cpp_audit -c audit.toml all

[project]
name = "number-maze"
root = "."
sources = ["src"]
excludes = ["build", ".git", "Source"]
build_system = "qmake"
project_file = "number-maze.pro"
build_dir = "build/audit"
target = "number-maze"
qmake = "qmake5"

[compat]
# C++14 + Qt5 项目；compat 的规则集面向 C++98，会产生系统性误报。
enabled = false
rules = []

[tidy]
# 安装的 clang-tidy 14~21 无法解析 Qt 5.6.3 头文件；Qt 6 迁移后恢复。
enabled = false
# clang-tidy 检查集由项目根目录 .clang-tidy 提供。
fail_on_warnings = true

[cpd]
enabled = true
dirs = ["src", "tests"]
min_tokens = 70

[asan]
# Qt 5.6 的 GUI 运行受当前容器显示/运行库限制，默认不放进 all；
# 构建路径使用 g++ 支持的 ASan 选项，可用 build --kind asan 验证。
enabled = false
build_dir = "build/asan"
output = "build/asan/bin/number-maze"
compiler = "g++"
cxxflags = ["-std=c++14", "-fsanitize=address",
            "-fno-omit-frame-pointer", "-g", "-O0"]
ldflags = ["-fsanitize=address"]
checks = ["detect_leaks"]
options = { halt_on_error = "0", symbolize = "1" }
timeout_sec = 120

[valgrind]
enabled = true
build_dir = "build/debug"
output = "build/debug/bin/number-maze"
compiler = "g++"
cxxflags = ["-std=c++14", "-g", "-O0"]
tool = "memcheck"
checks = ["leaks"]
# --suppressions：libfontconfig 退出时不释放字体缓存、libdbus 的连接在 Qt
# 拆事件循环后没有收尾，两者都会以 "definitely lost" 出现；那是系统侧的行为，
# 照实报只会淹掉真正的泄漏。
# --errors-for-leak-kinds=definite：只按"根块丢失"计错。间接丢失必然挂在某个
# 根上，根被报出来就够了；算进间接块只会把被抑制的系统泄漏的子树重复计一遍。
extra_args = ["--undef-value-errors=no",
              "--errors-for-leak-kinds=definite",
              "--suppressions=tools/valgrind.supp",
              # 默认 12 层会在 GUI 库里就截断，抑制规则按库名匹配时
              # 看不到关键帧；加深到 24 层才是能用的报告
              "--num-callers=24"]
timeout_sec = 300

# GUI 程序没有命令行退出路径：Xvfb + openbox + xdotool 关闭窗口，
# 让 Qt 正常退出，LeakSanitizer/Valgrind 才能拿到泄漏汇总。
[run]
args = []
env = { DISPLAY = ":102", QT_QPA_PLATFORM = "xcb", CXX_GUI_AUTOCLOSE_MS = "8000", XDG_RUNTIME_DIR = "build/audit/run", XDG_STATE_HOME = "build/audit/state", XDG_CONFIG_HOME = "build/audit/config", HOME = "build/audit/home" }
timeout_sec = 120
warmup_sec = 3
pre = [
    "mkdir -p build/audit/run build/audit/state build/audit/config build/audit/home",
    "pkill -f '[b]uild/debug/bin/number-maze' 2>/dev/null || true",
    "pkill -f '[X]vfb :102' 2>/dev/null || true",
    "Xvfb :102 -screen 0 1280x1024x24 >/tmp/number-maze-audit-xvfb.log 2>&1 &",
    "sleep 1",
    "openbox >/tmp/number-maze-audit-openbox.log 2>&1 &",
    "sleep 1",
]
stop = []
post = [
    "pkill -f '[X]vfb :102' 2>/dev/null || true",
]

[reports]
dir = "reports"
