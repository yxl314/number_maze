[project]
name = number-maze
version = 2.0.0

[build]
system = qmake
source = .
project_file = number-maze.pro
build_dir = build/pkg
target = number-maze
qmake = qmake5
make_args = -j4

[package]
formats = tar.gz,run
install_dir = /opt/number-maze
out_dir = dist
maintainer = unknown
description = Number Maze, a number sliding puzzle on a graph topology

[qt]
enabled = true
# 本机 Qt 5.6 安装前缀；换构建机时改成对应 Qt 前缀。
prefix = /opt/qt-5.6.3
