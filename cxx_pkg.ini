[project]
name = number-maze
version = 2.0.0

[build]
system = qmake
source = .
project_file = number-maze.pro
build_dir = build/pkg
target = number-maze
qmake = /usr/lib/qt5/bin/qmake
make_args = -j4

[package]
formats = tar.gz,run
install_dir = /opt/number-maze
out_dir = dist
maintainer = unknown
description = Number Maze, a number sliding puzzle on a graph topology

[qt]
enabled = true
prefix = /usr
